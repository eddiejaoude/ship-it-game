<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050807">
<title>Ship It! Indie Hacker Rush</title>
<meta name="description" content="A silly arcade runner for indie hackers. Squash bugs, close feature requests, park shiny ideas and recruit AI agents.">
<style>
  :root{
    --bg:#050807; --ink:#ecfdf5; --muted:#9bb8aa; --blue:#22c55e; --cyan:#5eead4;
    --gold:#ffd23f; --red:#ff4d6d; --green:#7cff6b; --card:rgba(8,16,13,.94);
    --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--ink);font-family:var(--font);
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;width:100vw;height:100vh;height:100dvh}
  #btns{position:fixed;top:10px;right:10px;display:flex;gap:8px;z-index:5}
  #btns button{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(8,16,13,.75);
    color:var(--ink);font-size:17px;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px)}
  #btns button.off{opacity:.4}
  #ov{position:fixed;inset:0;display:none;touch-action:pan-y;align-items:center;justify-content:center;z-index:10;padding:16px;
    background:radial-gradient(ellipse at center,rgba(4,8,6,.55),rgba(4,8,6,.88))}
  #ov.show{display:flex}
  .panel{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--card);border:1px solid rgba(255,255,255,.12);
    border-radius:22px;padding:24px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 1px rgba(74,222,128,.1) inset;
    animation:pop .28s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  h1{margin:0;font-size:clamp(40px,11vw,68px);line-height:.95;letter-spacing:-1px;font-weight:900;
    background:linear-gradient(180deg,#f0fdf4 0%,#86efac 45%,#22c55e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 0 #064e3b);font-family:var(--mono);letter-spacing:-3px}
  h2{margin:4px 0 0;font-size:clamp(15px,4vw,20px);letter-spacing:3px;color:var(--gold);font-weight:900}
  h3{margin:0 0 6px;font-size:clamp(26px,7vw,40px);font-weight:900}
  p{color:var(--muted);margin:8px 0;line-height:1.45}
  .how{text-align:left;margin:18px auto 6px;display:grid;gap:9px;max-width:430px;font-size:15px}
  .how>div{display:flex;gap:10px;align-items:flex-start;color:#cfdaf5}
  .how b{color:#fff}
  .how span.i{width:26px;flex:none;text-align:center;font-size:19px}
  .btn{display:inline-block;margin:14px 6px 0;padding:14px 24px;border-radius:14px;border:0;cursor:pointer;font:900 17px var(--font);
    color:#03140a;background:linear-gradient(180deg,#86efac,#22c55e);box-shadow:0 5px 0 #14532d;letter-spacing:.5px;text-decoration:none}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #14532d}
  .btn.alt{background:linear-gradient(180deg,#2b3a34,#1a2521);color:var(--ink);box-shadow:0 5px 0 #0c1210}
  .btn.gold{background:linear-gradient(180deg,#ffe680,#ffb020);box-shadow:0 5px 0 #8a5a00}
  .kbd{font:700 12px var(--mono);color:var(--muted);margin-top:12px}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
  @media (max-width:520px){.cards{grid-template-columns:1fr}}
  .card{cursor:pointer;border-radius:16px;padding:16px 12px;background:linear-gradient(180deg,#13221c,#0c1612);
    border:2px solid rgba(74,222,128,.25);transition:transform .12s,border-color .12s;text-align:center}
  .card:hover{transform:translateY(-4px);border-color:var(--cyan)}
  .card .ic{font-size:38px}
  .card .nm{font-weight:900;margin:6px 0 4px;font-size:16px}
  .card .ds{color:var(--muted);font-size:13px}
  .card .k{font:700 11px var(--mono);color:#6f80a8;margin-top:8px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 6px}
  .stat{background:rgba(255,255,255,.05);border-radius:12px;padding:10px 6px}
  .stat b{display:block;font-size:22px}
  .stat small{color:var(--muted);font-size:11px;letter-spacing:.5px;text-transform:uppercase}
  .soon{text-align:left;margin:14px auto 4px;max-width:420px;display:grid;gap:6px}
  .soon div{background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.18);border-radius:10px;padding:7px 12px;font-weight:800;color:#c7d3f0;font-size:14px}
  .soon div small{font-size:12px}
  @media (max-width:520px){.panel{padding:18px 14px}.stat b{font-size:19px}.stats{gap:6px}}
  .soon div small{display:block;color:var(--muted);font-weight:600}
  .lock{float:right}
  .tag{display:inline-block;font:800 11px var(--mono);padding:4px 8px;border-radius:999px;background:rgba(255,210,63,.15);color:var(--gold);letter-spacing:1px}
  .corner{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));z-index:11;transition:opacity .25s,visibility .25s}
  #social{left:max(10px,env(safe-area-inset-left));display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  #social .by{font:700 11px var(--mono);color:var(--muted);margin-right:2px;white-space:nowrap}
  #social a{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--ink);background:rgba(8,16,13,.75);
    border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px);transition:color .12s,border-color .12s,transform .12s}
  #social a:hover,#social a:focus-visible{color:var(--cyan);border-color:var(--cyan);transform:translateY(-2px)}
  #social svg{width:16px;height:16px}
  #star{right:max(10px,env(safe-area-inset-right));display:block;padding:0 12px;border-radius:10px;
    font:800 13px/30px var(--font);color:var(--gold);text-decoration:none;white-space:nowrap;background:rgba(8,16,13,.75);
    border:1px solid rgba(255,210,63,.45);backdrop-filter:blur(6px);transition:border-color .12s,transform .12s,box-shadow .12s}
  #star:hover,#star:focus-visible{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 0 14px rgba(255,210,63,.3)}
  #star[hidden]{display:none}
  /* Out of the way while playing: no distraction and no accidental taps while dragging */
  body[data-state="play"] .corner,body[data-state="dying"] .corner{opacity:0;visibility:hidden}
  /* Keep menu panels clear of the corner row */
  #ov{padding-bottom:64px}
  /* Phones: label above the icons so both corners fit; very small screens drop the label */
  @media (max-width:520px){#social{max-width:200px}#social .by{flex-basis:100%}}
  @media (max-width:380px){#social .by{display:none}}
  @media (max-width:360px){#star .lg{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="btns">
  <button id="bMusic" title="Music (M)" aria-label="Toggle music">🎵</button>
  <button id="bSfx" title="Sound effects (N)" aria-label="Toggle sound effects">🔊</button>
  <button id="bPause" title="Pause (P / Esc)" aria-label="Pause">⏸</button>
</div>
<div id="ov"></div>
<div id="social" class="corner"></div>
<a id="star" class="corner" hidden target="_blank" rel="noopener" aria-label="Star on GitHub" title="Enjoying the game? Star the repo on GitHub">⭐ Star<span class="lg"> on GitHub</span></a>
<script>
'use strict';
/* =========================================================================
   Ship It! Indie Hacker Rush
   A single-file canvas game. No assets, no backend, no build step.
   Everything (graphics, music, sound) is generated at runtime.
   ========================================================================= */

// ---- Config you may want to change when forking ------------------------------
const CONFIG = {
  repoUrl: 'https://github.com/eddiejaoude/ship-it-game',   // "Star on GitHub" in the corner on menu screens + win screen ('' to hide)
  shareUrl: 'https://eddiejaoude.github.io/ship-it-game/',  // URL included in share posts ('' = current page URL)
  // Creator credit + social links in the bottom-left corner (hidden during play).
  // Remove entries or set creator to null to hide. Available icons: see SOCIAL_ICONS.
  creator: {
    name: 'Eddie Jaoude',
    links: {
      github: 'https://github.com/eddiejaoude',
      substack: 'https://substack.com/@eddiejaoude',
      x: 'https://x.com/eddiejaoude',
      linkedin: 'https://www.linkedin.com/in/eddiejaoude/',
      youtube: 'https://www.youtube.com/eddiejaoude',
    },
  },
};

// ---- Utils -------------------------------------------------------------------
const rand=(a,b)=>a+Math.random()*(b-a);
const irand=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const mtof=n=>440*Math.pow(2,(n-69)/12);

// ---- Content -----------------------------------------------------------------
const FEATURES=['Dark mode?','SSO please','Export to Excel','Make it pop','Add AI to it','iOS app when?','Can it do my taxes?',
  'Bigger logo','Slack integration','Gantt charts','Offline mode','Put it on a blockchain','Just a tiny tweak','Make it free',
  'Comic Sans option','Undo for undo','Zapier?','White label pls'];
const IDEAS=['Pivot to Web3','Rewrite in Rust','New JS framework','Another todo app','Buy 12 domains','AI for dogs',
  'Start a podcast','Side project #47','Microservices!','Build my own DB','Learn Haskell','Redesign the logo'];
const BOSS_LINES=['Quick call?','Just ONE more feature','Can it also be a CRM?','My cousin has an idea','By Friday, ok?',
  'Make it like Notion','Add a chatbot','Can we circle back?','Per-seat pricing?','Small change request'];
const BG_TXT=['git push -f','npm i','// TODO','console.log(x)','works on my machine','SELECT *','deploy friday','200 OK','404',
  'ship it','useEffect(()=>{})','await fetch()','</div>','rm -rf node_modules','LGTM','v0.0.1','localhost:3000','.env',
  'it\'s a feature','merge conflict','npx create-app','MRR $0','sudo','::1','#buildinpublic'];

const LEVELS=[null,
  {name:'MVP SPRINT', sub:'Ship the MVP before the bugs ship you', len:1250, speed:14},
  {name:'LAUNCH DAY', sub:'Users are here. So are their requests.', len:1450, speed:16, boss:true},
];

// ---- Canvas & projection -----------------------------------------------------
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const ZF=150, TW=5, camDist=14;
let W=0,H=0,DPR=1,ppu0=40,focal=560,camH=10,horizonY=100,playerY=600,cx=0;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1); W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  horizonY=H*0.15; playerY=H*0.83; cx=W/2;
  ppu0=Math.min(W*0.088,H*0.064); focal=ppu0*camDist; camH=(playerY-horizonY)/ppu0;
}
window.addEventListener('resize',resize); resize();
const sc=z=>focal/(z+camDist);                   // pixels per world unit at depth z
const px=(x,z)=>cx+x*sc(z);
const py=(z,y=0)=>horizonY+(camH-y)*sc(z);
const fade=z=>clamp((ZF-z)/35,0,1);
function rr(x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

// ---- Sprites -----------------------------------------------------------------
const EMOJI_FONT='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';
function emojiSprite(ch,size=96){ const c=document.createElement('canvas'); c.width=c.height=size; const g=c.getContext('2d');
  g.textAlign='center'; g.textBaseline='middle'; g.font=`${size*0.78}px ${EMOJI_FONT}`; g.fillText(ch,size/2,size/2+size*0.06); return c; }
function coinSprite(size=64){ const c=document.createElement('canvas'); c.width=c.height=size; const g=c.getContext('2d'); const r=size/2;
  const hex=(rad)=>{ g.beginPath(); for(let i=0;i<6;i++){ const a=Math.PI/6+i*Math.PI/3; g.lineTo(r+Math.cos(a)*rad,r+Math.sin(a)*rad); } g.closePath(); };
  const gr=g.createLinearGradient(0,0,0,size); gr.addColorStop(0,'#99f6e4'); gr.addColorStop(0.5,'#2dd4bf'); gr.addColorStop(1,'#0f766e');
  hex(r-2); g.fillStyle=gr; g.fill(); g.lineWidth=size*0.06; g.strokeStyle='#064e3b'; hex(r*0.72); g.stroke();
  g.fillStyle='#042f2e'; g.font=`900 ${size*0.34}px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace`; g.textAlign='center'; g.textBaseline='middle'; g.fillText('AI',r,r+size*0.03); return c; }
function glyphSprite(ch,col){ const c=document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d');
  g.textAlign='center'; g.textBaseline='middle'; g.font=`800 ${ch.length>2?24:ch.length>1?30:40}px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace`;
  g.shadowColor=col; g.shadowBlur=10; g.fillStyle=col; g.fillText(ch,32,34); g.shadowBlur=0; g.fillStyle='#ecfdf5'; g.globalAlpha=0.6; g.fillText(ch,32,34); return c; }
const GLYPHS=['{','}',';','</>','=>','()','[]'];
const SPR={ bugs:['🐛','🐜','🦗'].map(e=>emojiSprite(e)), glyph:GLYPHS.map(c=>glyphSprite(c,'#4ade80')), glyph2:GLYPHS.map(c=>glyphSprite(c,'#fbbf24')), idea:emojiSprite('💡'), ping:emojiSprite('💬'), coin:coinSprite() };

// ---- Audio (all synthesized) -------------------------------------------------
const AU={ctx:null,master:null,sfx:null,mus:null,noise:null,musicOn:true,sfxOn:true,last:{}};
function audioInit(){
  if(AU.ctx){ if(AU.ctx.state==='suspended') AU.ctx.resume(); return; }
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  const c=AU.ctx=new AC();
  const comp=c.createDynamicsCompressor(); comp.threshold.value=-12; comp.ratio.value=4; comp.connect(c.destination);
  AU.master=c.createGain(); AU.master.gain.value=0.9; AU.master.connect(comp);
  AU.sfx=c.createGain(); AU.sfx.gain.value=AU.sfxOn?0.6:0; AU.sfx.connect(AU.master);
  AU.mus=c.createGain(); AU.mus.gain.value=AU.musicOn?0.3:0; AU.mus.connect(AU.master);
  const b=c.createBuffer(1,c.sampleRate,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; AU.noise=b;
}
function tone(o){ const c=AU.ctx; if(!c) return; const t=o.when??c.currentTime, dur=o.dur||0.1;
  const osc=c.createOscillator(), g=c.createGain(); osc.type=o.type||'square'; osc.frequency.setValueAtTime(o.f,t);
  if(o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(o.vol??0.2,t+(o.att||0.005)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  osc.connect(g); let out=g; if(o.lp){ const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=o.lp; g.connect(f); out=f; }
  out.connect(o.dest||AU.sfx); osc.start(t); osc.stop(t+dur+0.05); }
function noise(o){ const c=AU.ctx; if(!c) return; const t=o.when??c.currentTime, dur=o.dur||0.1;
  const s=c.createBufferSource(); s.buffer=AU.noise; const f=c.createBiquadFilter(); f.type=o.ft||'highpass'; f.frequency.value=o.freq||1000;
  const g=c.createGain(); g.gain.setValueAtTime(o.vol??0.2,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(o.dest||AU.sfx); s.start(t,Math.random()*0.5); s.stop(t+dur+0.02); }
const SFX={
  shoot:t=>tone({f:1250,f2:620,type:'square',dur:0.045,vol:0.03,when:t}),
  hit:t=>noise({dur:0.03,vol:0.05,freq:3500,when:t}),
  pop:t=>{tone({f:720,f2:140,type:'triangle',dur:0.1,vol:0.12,when:t}); noise({dur:0.04,vol:0.05,freq:2500,when:t});},
  crunch:t=>{noise({dur:0.28,vol:0.3,ft:'lowpass',freq:1800,when:t}); tone({f:240,f2:50,type:'sawtooth',dur:0.25,vol:0.14,when:t});},
  idea:t=>{tone({f:1600,f2:300,type:'sine',dur:0.25,vol:0.14,when:t}); tone({f:900,f2:2400,type:'triangle',dur:0.16,vol:0.07,when:t+0.03});},
  coin:t=>{tone({f:988,type:'square',dur:0.05,vol:0.06,when:t}); tone({f:1319,type:'square',dur:0.1,vol:0.06,when:t+0.05});},
  good:t=>[523,659,784,1047].forEach((f,i)=>tone({f,type:'square',dur:0.12,vol:0.08,when:t+i*0.06})),
  bad:t=>{tone({f:330,f2:70,type:'sawtooth',dur:0.5,vol:0.16,lp:1200,when:t}); tone({f:311,f2:66,type:'sawtooth',dur:0.5,vol:0.1,lp:1000,when:t+0.02});},
  hurt:t=>{tone({f:170,f2:45,type:'sine',dur:0.18,vol:0.3,when:t}); noise({dur:0.08,vol:0.12,ft:'lowpass',freq:900,when:t});},
  gateUp:t=>tone({f:1046,f2:1568,type:'triangle',dur:0.08,vol:0.07,when:t}),
  levelup:t=>{[392,523,659,784,1047].forEach((f,i)=>tone({f,type:'square',dur:0.16,vol:0.07,when:t+i*0.07})); tone({f:1568,type:'triangle',dur:0.6,vol:0.08,when:t+0.35});},
  click:t=>tone({f:880,type:'triangle',dur:0.05,vol:0.08,when:t}),
  roar:t=>{tone({f:90,f2:38,type:'sawtooth',dur:1.4,vol:0.35,lp:500,when:t}); tone({f:96,f2:41,type:'square',dur:1.4,vol:0.15,lp:400,when:t}); noise({dur:1.2,vol:0.18,ft:'lowpass',freq:400,when:t});},
  bossHit:t=>tone({f:190,f2:120,type:'square',dur:0.05,vol:0.045,when:t}),
  boom:t=>{noise({dur:1.0,vol:0.5,ft:'lowpass',freq:700,when:t}); tone({f:130,f2:28,type:'sine',dur:0.9,vol:0.5,when:t});},
  ping:t=>{tone({f:1319,type:'sine',dur:0.09,vol:0.08,when:t}); tone({f:1760,type:'sine',dur:0.12,vol:0.08,when:t+0.1});},
  win:t=>{const n=[[523,.12],[523,.12],[523,.12],[659,.3],[784,.3],[659,.15],[784,.15],[1047,.7]]; let o=0; n.forEach(([f,d])=>{tone({f,type:'square',dur:d,vol:0.08,when:t+o}); tone({f:f/2,type:'triangle',dur:d,vol:0.1,when:t+o}); o+=d;});},
  lose:t=>[392,370,349,311].forEach((f,i)=>tone({f,f2:f*0.96,type:'triangle',dur:i===3?1:0.32,vol:0.16,when:t+i*0.34})),
};
const SFX_MIN={shoot:0.085,hit:0.04,pop:0.035,coin:0.045,hurt:0.07,gateUp:0.05,bossHit:0.06,crunch:0.08};
function sfx(name){ if(!AU.ctx||!AU.sfxOn) return; const now=AU.ctx.currentTime, m=SFX_MIN[name]||0.03;
  if(AU.last[name]!==undefined && now-AU.last[name]<m) return; AU.last[name]=now; SFX[name](now); }

// Tiny step sequencer for the music
const SONGS={
  title:{bpm:100,drums:false,chords:[[45,'m'],[41,'M'],[48,'M'],[43,'M']],arp:true,lead:false},
  main:{bpm:132,drums:true,chords:[[45,'m'],[41,'M'],[48,'M'],[43,'M']],arp:true,lead:true},
  main2:{bpm:142,drums:true,chords:[[45,'m'],[41,'M'],[48,'M'],[43,'M']],arp:true,lead:true,busy:true},
  boss:{bpm:152,drums:true,chords:[[45,'m'],[46,'M'],[45,'m'],[40,'M']],arp:true,lead:false,busy:true,boss:true},
};
const LEAD=[69,-1,72,69,76,-1,74,72, 72,-1,69,72,77,-1,76,74, 76,-1,72,76,79,-1,77,76, 74,-1,71,74,79,77,76,74];
const MUS={kind:null,step:0,next:0,timer:null};
function music(kind){ if(!AU.ctx) return; MUS.kind=kind; MUS.step=0; MUS.next=AU.ctx.currentTime+0.06;
  if(!MUS.timer) MUS.timer=setInterval(schedule,25); }
function musicStop(){ clearInterval(MUS.timer); MUS.timer=null; MUS.kind=null; }
function schedule(){ const c=AU.ctx; if(!c||!MUS.kind) return; const song=SONGS[MUS.kind];
  if(MUS.next<c.currentTime-0.2) MUS.next=c.currentTime+0.02;
  while(MUS.next<c.currentTime+0.12){ playStep(song,MUS.step,MUS.next); MUS.next+=60/song.bpm/4; MUS.step++; } }
function playStep(song,step,t){
  const D=AU.mus, s=step%16, bar=Math.floor(step/16)%song.chords.length, loop=Math.floor(step/64);
  const [root,q]=song.chords[bar], third=q==='m'?3:4;
  if(song.drums){
    if(s%4===0 || (song.boss && s===14)){ tone({f:150,f2:42,type:'sine',dur:0.2,vol:0.55,when:t,dest:D}); }
    if(s===4||s===12){ noise({dur:0.14,vol:0.2,freq:1500,when:t,dest:D}); tone({f:190,f2:140,type:'triangle',dur:0.07,vol:0.12,when:t,dest:D}); }
    if(s%2===0 || song.busy) noise({dur:0.03,vol:s%4===2?0.07:0.03,freq:7500,when:t,dest:D});
  }
  if(song.busy ? true : s%2===0){
    const pat=song.busy?[0,0,12,0,7,0,12,0,0,0,12,0,7,12,0,7]:[0,0,12,0,0,12,7,12];
    const n=root+pat[song.busy?s:s/2]; tone({f:mtof(n),type:'sawtooth',dur:song.busy?0.09:0.14,vol:0.13,lp:song.boss?700:950,when:t,dest:D});
  }
  if(song.arp){ const ch=[0,third,7,12]; const n=root+24+ch[s%4]+(s>=8&&song.drums?12:0);
    tone({f:mtof(n),type:song.boss?'sawtooth':'square',dur:0.07,vol:song.drums?0.035:0.045,lp:song.boss?2200:null,when:t,dest:D}); }
  if(song.lead && loop%2===1 && s%2===0){ const n=LEAD[(bar*8+s/2)%32]; if(n>0) tone({f:mtof(n),type:'triangle',dur:0.2,vol:0.09,when:t,dest:D}); }
}

// ---- Game state --------------------------------------------------------------
const G={state:'title',t:0,level:1,dist:0,scroll:0,speed:10,baseSpeed:14,levelLen:1,events:[],evIdx:0,msgs:[],msgIdx:0,
  enemies:[],bullets:[],gates:[],tokens:[],parts:[],floats:[],banner:null,finish:null,boss:null,rowId:0,
  shake:0,slow:0,pendingUp:0,dieT:0,snap:null,bossSnap:null,stats:null,paused:false,hm:1};
const S={x:0,tx:0,n:6,fireRate:1,dmg:1,pierce:0,spread:0,magnet:1,fireT:0,xp:0,lvl:1,hurt:0,picks:{},peak:1};
const xpNeed=l=>10+(l-1)*7;
const MAX_N=99; // team cap ("rate limited")
const FORM=[]; for(let i=0;i<80;i++){ const r=0.3*Math.sqrt(i), a=i*2.39996; FORM.push({x:Math.cos(a)*r,z:Math.sin(a)*r*0.75,i}); }
const FORM_ORDER=FORM.slice().sort((a,b)=>b.z-a.z);
const squadR=()=>0.3*Math.sqrt(Math.min(Math.max(S.n,1),80))+0.35;
function snapshot(){ return JSON.parse(JSON.stringify(S)); }
function restoreSnap(sn){ Object.assign(S,JSON.parse(JSON.stringify(sn))); S.x=S.tx=0; S.fireT=0; S.hurt=0; }

// ---- Level building ----------------------------------------------------------
// Enemy HP is expressed as "seconds of your team's firepower", partly adaptive:
// effective DPS = expected^0.4 * actual^0.6, so upgrades still feel strong but nothing is ever trivial.
const diffX=()=>G.boss?2:(G.level-1)+clamp(G.dist/G.levelLen,0,1);
const refDPS=x=>8+150*x+90*x*x;
function estDPS(){ const sh=Math.min(Math.max(S.n,1),40);
  return (sh*S.dmg*Math.sqrt(Math.max(1,S.n/40)) + S.spread*S.dmg*Math.max(2,sh/4))*S.fireRate/0.3; }
function hpFor(secs){ const eff=Math.pow(refDPS(diffX()),0.4)*Math.pow(estDPS(),0.6); return Math.max(1,Math.round(secs*eff)); }

function buildLevel(L){
  const def=LEVELS[L], len=def.len, ev=[], msgs=[];
  const kd=d=>(L-1)+d/len;                                   // difficulty 0..2 across the demo
  const LX={L:[-4.4,-0.6],R:[0.6,4.4],C:[-2.6,2.6],F:[-4.5,4.5]};
  const tokens=(d,lane,n=9)=>{ const [a,b]=LX[lane], mid=(a+b)/2, amp=(b-a)/2*0.75;
    for(let i=0;i<n;i++) ev.push({d:d+i*2.4,type:'token',x:mid+Math.sin(i*0.8)*amp}); return n*2.4+4; };
  const swarm=(d,lane,rows,cols,secs)=>{ const [a,b]=LX[lane], sp=(b-a)/(cols-1), per=secs/(rows*cols);
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) ev.push({d:d+r*0.85,type:'bug',x:clamp(a+c*sp+(r%2?sp*0.35:0),a,b)+rand(-0.08,0.08),secs:per});
    return rows*0.85+16; };
  const gates=(d,A,B,noSwap)=>{ if(!noSwap && Math.random()<0.5) [A,B]=[B,A];
    ev.push({d,type:'gates',row:[{x0:-TW,x1:0,...A},{x0:0,x1:TW,...B}]}); return 26; };
  const tickets=(d,n,secs)=>{ for(let i=0;i<n;i++) ev.push({d:d+i*3,type:'ticket',x:n===1?rand(-2.8,2.8):lerp(-3.2,3.2,i/(n-1))+rand(-0.3,0.3),secs}); return 22+n*3; };
  const ideas=(d,n,secs)=>{ for(let i=0;i<n;i++) ev.push({d:d+i*5,type:'idea',x:rand(-3,3),secs}); return 18+n*5; };
  const good=x=>Math.random()<(0.06+x*0.04)?{kind:'mul',val:2}:{kind:'add',val:Math.round(rand(3,5.5)+x*4)};
  const bad=x=>(x>0.8&&Math.random()<0.25)?{kind:'div',val:2}:{kind:'add',val:-Math.round(rand(3,6)+x*6)};

  let d=26, lastGate=0;
  msgs.push({d:0,big:`LEVEL ${L}`,text:def.name,sub:def.sub});
  if(L===1){
    d+=tokens(d,'C');
    d+=gates(d,{kind:'add',val:5},{kind:'add',val:2})+6;   // first choice is always safe
    d+=swarm(d,'C',2,4,0.3)+4;
    d+=tokens(d,'R');
    d+=gates(d,{kind:'add',val:6},{kind:'mul',val:2})+6;
    d+=swarm(d,'F',2,9,0.8)+4;
    d+=tokens(d,'L',7);
    lastGate=d; d+=gates(d,good(0.15),bad(0.15))+4;
    msgs.push({d:d-60,big:'⚠',text:'USERS FOUND YOUR APP',sub:'Feature requests incoming'});
    d+=tickets(d,2,0.8)+4;
    msgs.push({d:len*0.55,big:'😅',text:'WORKS ON MY MACHINE',sub:'...mostly'});
  } else {
    d+=tokens(d,'C');
    lastGate=d; d+=gates(d,good(1),good(1))+4;
    msgs.push({d:len*0.4,big:'🔥',text:'FRONT PAGE OF HACKER NEWS',sub:'Traffic x100. Bugs x100.'});
    msgs.push({d:len*0.82,big:'👀',text:'ALMOST LAUNCHED',sub:'Something big is lurking in the backlog...'});
  }
  while(d<len-70){
    const x=kd(d), r=Math.random();
    if(d-lastGate>90){ d+=gates(d,good(x),Math.random()<0.7?bad(x):good(x)); lastGate=d; }
    else if(r<0.2){ // swarm guards the good gate, the clear lane has the bad one
      const lane=Math.random()<0.5?'L':'R', rows=irand(3,4)+Math.floor(x*2.5);
      const l2=swarm(d,lane,rows,5,1.0+1.2*x); const g=good(x+0.3), b=bad(x);
      gates(d+l2-8, lane==='L'?g:b, lane==='L'?b:g, true); d+=l2+18; lastGate=d;
    }
    else if(r<0.4){ d+=swarm(d,'F',3+Math.floor(x*4+rand(0,2)),10,1.4+1.65*x); d+=tokens(d,pick(['L','R','C']),7); }
    else if(r<0.55){ d+=tickets(d,clamp(1+Math.floor(x*1.2+rand(0,1.3)),1,3),0.7+0.5*x); }
    else if(r<0.67){ d+=ideas(d,2+Math.floor(x+rand(0,1)),0.45+0.3*x); }
    else if(r<0.85){ const lane=Math.random()<0.5?'L':'R'; swarm(d,lane,4+Math.floor(x*4),5,1.7+1.5*x); d+=tokens(d,lane==='L'?'R':'L')+8; }
    else { d+=tokens(d,pick(['L','R','C'])); }
    d+=rand(6,14)-x*2;
  }
  ev.push({d:len,type:'finish'});
  ev.sort((a,b)=>a.d-b.d); msgs.sort((a,b)=>a.d-b.d);
  return {ev,msgs};
}

// ---- Spawning ----------------------------------------------------------------
function spawnEvent(e,z){
  switch(e.type){
    case 'bug': { const hp=hpFor(e.secs); G.enemies.push({type:'bug',x:e.x,z,hp,max:hp,r:0.36,rz:0.4,spd:1.2,dmg:1,t:rand(0,9),spr:pick(SPR.bugs),flash:0}); break; }
    case 'ticket': { const hp=hpFor(e.secs); G.enemies.push({type:'ticket',x:e.x,z,hp,max:hp,r:1.3,rz:0.45,spd:0.6,dmg:6,t:0,text:pick(FEATURES),flash:0}); break; }
    case 'idea': { const hp=hpFor(e.secs); G.enemies.push({type:'idea',x:e.x,x0:e.x,z,hp,max:hp,r:0.8,rz:0.5,spd:2.6,dmg:3,t:0,ph:rand(0,6),text:pick(IDEAS),flash:0}); break; }
    case 'token': G.tokens.push({x:e.x,z,t:rand(0,6),home:false}); break;
    case 'gates': { const id=++G.rowId; for(const s of e.row) G.gates.push(makeGate(s,z,id)); break; }
    case 'finish': G.finish={z}; break;
  }
}
function makeGate(s,z,rowId,pass){ const g={...s,z,rowId,pass:!!pass,used:false,prog:0,steps:0,flash:0,fade:1,label:'AGENTS'};
  if(gateNeg(g)) g.label=g.kind==='div'?'MEETINGS':pick(['BURNOUT','TECH DEBT','CHURN','DOOMSCROLL']); return g; }
const gateNeg=g=>g.kind==='div'||(g.kind==='add'&&g.val<0);

// ---- FX helpers --------------------------------------------------------------
function burst(x,z,y,colors,n,spd=6){ for(let i=0;i<n;i++) G.parts.push({x,z,y,vx:rand(-spd,spd),vz:rand(-spd,spd),vy:rand(2,spd*1.4),
  life:rand(0.35,0.8),max:0.8,c:pick(colors),s:rand(0.08,0.2)}); }
function float(x,z,y,text,color='#fff',size=0.55,life=1.1){ G.floats.push({x,z,y,text,color,size,life,max:life}); }
function banner(big,text,sub,dur=2.4){ G.banner={big,text,sub,t:0,dur}; }
function shake(a){ G.shake=Math.max(G.shake,a); }

// ---- Flow --------------------------------------------------------------------
function setState(s){ G.state=s; document.body.dataset.state=s; }
function newRun(){

function startLevel(L){
  const def=LEVELS[L]; G.level=L; G.baseSpeed=def.speed; G.speed=def.speed*0.4; G.dist=0; G.levelLen=def.len;

function die(){ if(G.state!=='play') return; S.n=0; setState('dying'); G.dieT=0; G.slow=1.2; sfx('lose'); musicStop(); shake(14);
  burst(S.x,0,0.6,['#22c55e','#8fd3ff','#ff8a3d'],40,8); banner('💀','BURNOUT','',2); }

    ${G.boss?'<button class="btn primary" data-a="retryBoss">Retry boss ▶</button>':'<button class="btn primary" data-a="retry">Retry level ▶</button>'}
    <button class="btn alt" data-a="restart">From the top</button><div class="kbd">SPACE / ENTER to retry</div></div>`);

function openUpgrade(){
  G.pendingUp--; setState('upgrade'); sfx('levelup');
  const avail=UPGRADES.filter(u=>(S.picks[u.id]||0)<u.max); const opts=[];

}
const agentsGift=()=>5+S.lvl*2;
function addAgents(k){ S.n=capTeam(S.n+k); S.peak=Math.max(S.peak,S.n); burst(S.x,0,1,['#86efac','#22c55e','#ffffff'],Math.min(30,k*3),5); }
const UPGRADES=[
  {id:'rate',icon:'⚡',name:'Faster Inference',desc:'+25% fire rate',max:4,apply(){S.fireRate*=1.25;}},
  {id:'dmg',icon:'🧠',name:'Bigger Context Window',desc:'+40% damage',max:5,apply(){S.dmg*=1.4;}},
  {id:'agents',icon:'🤖',name:'Spawn Sub-agents',desc:()=>`+${agentsGift()} agents join your team`,max:99,apply(){addAgents(agentsGift());}},
  {id:'pierce',icon:'🎯',name:'Root Cause Analysis',desc:'Shots pierce through +1 enemy',max:3,apply(){S.pierce++;}},
  {id:'spread',icon:'🔀',name:'Parallel Tool Calls',desc:'Fire extra diagonal shots',max:3,apply(){S.spread++;}},
  {id:'magnet',icon:'🧲',name:'Token Magnet',desc:'Grab AI tokens from further away',max:3,apply(){S.magnet*=1.6;}},
];
function pickUpgrade(i){ const u=G.upOpts&&G.upOpts[i]; if(!u||G.state!=='upgrade') return; u.apply(); S.picks[u.id]=(S.picks[u.id]||0)+1;
  hideOverlay(); setState('play'); float(S.x,0,2.6,u.name+'!','#5eead4',0.6,1.4); }
function pause(on){
  if(on && G.state==='play'){ setState('paused'); musicStop();
    showOverlay(`<div class="panel"><h3>⏸ Paused</h3><p>Standup over already?</p><button class="btn primary" data-a="resume">Resume ▶</button>
    <button class="btn alt" data-a="restart">Restart</button><div class="kbd">P / ESC to resume</div></div>`); }
  else if(!on && G.state==='paused'){ hideOverlay(); setState('play'); music(G.boss?'boss':(G.level===1?'main':'main2')); }
}

// ---- Update ------------------------------------------------------------------
function update(dt){
  G.t+=dt; G.stats.time+=dt;
  const b=G.boss;
  const target=b?5:G.baseSpeed;
  G.speed+=(target-G.speed)*Math.min(1,dt*1.5);
  G.dist+=G.speed*dt; G.scroll+=G.speed*dt;

  // spawns
  while(G.evIdx<G.events.length && G.events[G.evIdx].d-G.dist<=ZF){ const e=G.events[G.evIdx++]; spawnEvent(e,e.d-G.dist); }
  while(G.msgIdx<G.msgs.length && G.dist>=G.msgs[G.msgIdx].d){ const m=G.msgs[G.msgIdx++]; banner(m.big,m.text,m.sub); }

  // player
  if(G.state==='play'){
    if(keys.left) S.tx-=13*dt; if(keys.right) S.tx+=13*dt;
    const R=squadR(), lim=TW-Math.min(R*0.55,1.6)-0.25; S.tx=clamp(S.tx,-lim,lim);
    S.x+=(S.tx-S.x)*Math.min(1,dt*14);
    S.fireT-=dt; if(S.fireT<=0){ S.fireT+=0.3/S.fireRate; if(S.fireT<0) S.fireT=0; volley(); }
  }
  S.hurt=Math.max(0,S.hurt-dt);
  const R=squadR();

  // bullets
  for(const bu of G.bullets){
    bu.pz=bu.z; bu.z+=bu.vz*dt; bu.x+=bu.vx*dt;
    if(bu.z>78||Math.abs(bu.x)>TW+0.5){ bu.dead=true; continue; }
    for(const g of G.gates){ if(g.used) continue;
      if(bu.pz<g.z && bu.z>=g.z && bu.x>=g.x0 && bu.x<=g.x1){ gateHit(g,bu.dmg); if(!g.pass){ bu.dead=true; break; } } }
    if(bu.dead) continue;
    for(const e of G.enemies){ if(e.dead||e===bu.last) continue;
      if(e.z-e.rz<=bu.z && e.z+e.rz>=bu.pz-0.6 && Math.abs(e.x-bu.x)<e.r){
        damageEnemy(e,bu.dmg); if(bu.pierce>0){ bu.pierce--; bu.last=e; } else { bu.dead=true; break; } } }
    if(bu.dead) continue;
    if(b && !b.enter && !b.dead && bu.z>=b.z-1.2 && Math.abs(bu.x-b.x)<4.4){
      b.hp-=bu.dmg; b.flash=0.05; bu.dead=true; sfx('bossHit');
      if(Math.random()<0.15) burst(bu.x,b.z-1.5,rand(1.5,5),['#c77dff','#ffd23f'],2,4);
      if(b.hp<=0) bossDie(); }
  }
  G.bullets=G.bullets.filter(x=>!x.dead);

  // enemies
  for(const e of G.enemies){ if(e.dead) continue;
    e.t+=dt; e.flash=Math.max(0,e.flash-dt);

// ---- Main loop ---------------------------------------------------------------
let last=performance.now();
function frame(now){
  let dt=Math.min(0.05,(now-last)/1000); last=now;
  if(G.slow>0){ G.slow-=dt; dt*=0.35; }
  G.shake=Math.max(0,G.shake-dt*30);
  if(G.state==='play'||G.state==='dying'){ update(dt); if(G.state==='dying'){ G.dieT+=dt; if(G.dieT>0.9) showGameOver(); } }
  else if(G.state==='title'||G.state==='intermission'||G.state==='victory'){ G.t+=dt; G.speed=lerp(G.speed,9,dt); G.scroll+=G.speed*dt;
    for(const p of G.parts){ p.life-=dt; p.x+=p.vx*dt; p.z+=p.vz*dt; p.vy-=16*dt; p.y=Math.max(0,p.y+p.vy*dt); } G.parts=G.parts.filter(p=>p.life>0);
    if(G.state==='victory' && Math.random()<0.25) burst(rand(-4,4),rand(6,20),rand(2,6),['#ffd23f','#5eead4','#ff4d6d','#7cff6b','#c77dff'],6,6); }
  render(dt);
  requestAnimationFrame(frame);
}

const ov=document.getElementById('ov');

function hideOverlay(){ ov.classList.remove('show'); ov.innerHTML=''; }
const ACTIONS={
  start(){ newRun(); }, next(){ startLevel(2); }, retry(){ retryLevel(); }, retryBoss(){ retryBoss(); },
  restart(){ newRun(); }, resume(){ pause(false); }, pick(v){ pickUpgrade(+v); },
};
ov.addEventListener('click',e=>{ const a=e.target.closest('[data-a]'); if(!a) return; audioInit(); sfx('click'); ACTIONS[a.dataset.a](a.dataset.v); });

function toggleSfx(){ AU.sfxOn=!AU.sfxOn; if(AU.sfx) AU.sfx.gain.value=AU.sfxOn?0.6:0; document.getElementById('bSfx').classList.toggle('off',!AU.sfxOn); }
document.getElementById('bMusic').onclick=()=>{ audioInit(); toggleMusic(); };
document.getElementById('bSfx').onclick=()=>{ audioInit(); toggleSfx(); };
document.getElementById('bPause').onclick=()=>{ if(G.state==='play') pause(true); else if(G.state==='paused') pause(false); };

function renderCreator(){
  const c=CONFIG.creator; if(!c||!c.links) return;
  const links=Object.entries(c.links).filter(([k,url])=>url&&SOCIAL_ICONS[k]); if(!links.length) return;
  document.getElementById('social').innerHTML=(c.name?`<span class="by">Made by ${c.name}</span>`:'')+links.map(([k,url])=>{
    const t=c.name?`${c.name} on ${SOCIAL_ICONS[k].label}`:SOCIAL_ICONS[k].label;
    return `<a href="${url}" target="_blank" rel="noopener me" title="${t}" aria-label="${t}"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="${SOCIAL_ICONS[k].d}"/></svg></a>`;
  }).join('');
}
function renderStar(){
  if(!CONFIG.repoUrl) return;
  const a=document.getElementById('star'); a.href=CONFIG.repoUrl; a.hidden=false;
}
