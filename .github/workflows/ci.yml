name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PRs: a new push cancels the stale run. main: runs queue so a deploy is never cut off mid-way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: Playwright smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build:
    name: Build Pages artifact
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # The game is a single self-contained file. Publish it plus the link-preview image only.
      - name: Build site
        run: |
          mkdir -p _site/assets
          cp index.html _site/
          cp assets/og-image.jpg _site/assets/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Upload and deploy are separate jobs so that "Re-run failed jobs" only re-runs the
  # deploy and never uploads a second "github-pages" artifact (which deploy-pages rejects).
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      # The artifact list can lag behind a finished upload, so the first lookup may find
      # nothing: https://github.com/actions/deploy-pages/issues/451. A failed lookup
      # happens before any deployment is created, so retrying once later is safe.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
